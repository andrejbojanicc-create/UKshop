<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nitro Method</title>
<style>
/* General Dark Theme */
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #050505;
    color: white;
    text-align: center;
    padding: 50px;
    overflow-x: hidden;
}

/* Glowing animated background */
body::before {
    content: "";
    position: fixed;
    width: 600px;
    height: 600px;
    background: rgba(0,255,200,0.08);
    filter: blur(120px);
    top: -100px;
    left: -100px;
    animation: move 10s infinite alternate;
}
@keyframes move {
    0% { transform: translate(0,0); }
    100% { transform: translate(300px,200px); }
}

/* Card styling */
.card {
    background: rgba(20,20,20,0.9);
    padding: 50px;
    border-radius: 15px;
    display: inline-block;
    border: 1px solid #222;
    transition: 0.4s;
}
.card:hover {
    transform: scale(1.05);
    box-shadow: 0 0 40px rgba(0,255,200,0.4);
    border-color: #00ffc8;
}

/* Header & text */
h1 {
    margin-bottom: 10px;
}
p {
    color: #aaa;
    font-size: 16px;
}

/* Button */
.btn {
    display: inline-block;
    padding: 15px 30px;
    border-radius: 8px;
    border: 1px solid #00ffc8;
    color: #00ffc8;
    text-decoration: none;
    margin-top: 20px;
    transition: 0.3s;
}
.btn:hover {
    background: #00ffc8;
    color: black;
    box-shadow: 0 0 20px #00ffc8;
}

/* Footer */
footer {
    margin-top: 50px;
    color: #555;
    border-top: 1px solid #111;
    padding-top: 20px;
}
</style>
</head>

<body>

<div class="card">
    <h1>Nitro Method</h1>
    <p>Unlock premium features instantly for €4.</p>
    <a href="checkout.html" class="btn">Buy Now</a>
</div>

<footer>More services coming soon...</footer>

</body>
</html>
