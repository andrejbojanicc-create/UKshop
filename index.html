<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nitro Method</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #050505;
    color: white;
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: fixed;
    width: 600px;
    height: 600px;
    background: rgba(0,255,200,0.08);
    filter: blur(120px);
    top: -100px;
    left: -100px;
    animation: move 10s infinite alternate;
  }
  @keyframes move {
    0% { transform: translate(0,0); }
    100% { transform: translate(300px,200px); }
  }
  header {
    text-align: center;
    padding: 30px;
    font-size: 28px;
    letter-spacing: 3px;
    border-bottom: 1px solid #111;
  }
  .container {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 80vh;
  }
  .card {
    background: rgba(20,20,20,0.9);
    padding: 40px;
    border-radius: 15px;
    width: 350px;
    text-align: center;
    border: 1px solid #222;
    transition: 0.4s;
    backdrop-filter: blur(10px);
  }
  .card:hover {
    transform: scale(1.05);
    box-shadow: 0 0 40px rgba(0,255,200,0.4);
    border-color: #00ffc8;
  }
  h2 {
    margin-bottom: 10px;
  }
  .desc {
    color: #aaa;
    font-size: 14px;
  }
  .price {
    font-size: 36px;
    margin: 20px 0;
    color: #00ffc8;
  }
  .stock {
    color: #ff4d4d;
    font-size: 13px;
    margin-bottom: 15px;
  }
  .btn {
    display: inline-block;
    padding: 12px 25px;
    border: 1px solid #00ffc8;
    border-radius: 8px;
    color: #00ffc8;
    text-decoration: none;
    transition: 0.3s;
  }
  .btn:hover {
    background: #00ffc8;
    color: black;
    box-shadow: 0 0 20px #00ffc8;
  }
  .payment {
    margin-top: 15px;
    font-size: 13px;
    color: #888;
  }
  footer {
    text-align: center;
    padding: 20px;
    color: #555;
    border-top: 1px solid #111;
  }
</style>
</head>
<body>
<header>NITRO METHOD</header>
<div class="container">
  <div class="card">
    <h2>Nitro Method</h2>
    <p class="desc">Unlock premium features instantly with our exclusive method.</p>
    <div class="price">€4</div>
    <div class="stock">⚠ Limited availability</div>
    <a href="litecoin:ltc1q3zwtq2w0z9muz6hl5qeh0a7ej94ygrkchn6ksc" class="btn">
      Pay with Litecoin
    </a>
    <div class="payment">
      Litecoin (LTC) only
    </div>
  </div>
</div>
<footer>More services coming soon...</footer>
</body>
</html>
