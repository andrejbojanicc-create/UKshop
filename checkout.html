<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout - Nitro Method</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #050505;
    color: white;
    text-align: center;
    padding: 50px;
}
.card {
    background: rgba(20,20,20,0.9);
    padding: 50px;
    border-radius: 15px;
    display: inline-block;
    border: 1px solid #222;
}
h1 {
    margin-bottom: 20px;
}
.address {
    font-family: monospace;
    font-size: 18px;
    color: #00ffc8;
    margin: 20px 0;
    word-break: break-all;
}
.btn {
    padding: 12px 25px;
    border-radius: 8px;
    border: 1px solid #00ffc8;
    color: #00ffc8;
    text-decoration: none;
    display: inline-block;
    margin-top: 20px;
    transition: 0.3s;
}
.btn:hover {
    background: #00ffc8;
    color: black;
    box-shadow: 0 0 20px #00ffc8;
}
</style>
</head>

<body>

<div class="card">
    <h1>Pay with Litecoin</h1>
    <p>Send the payment to this address:</p>
    <div class="address">ltc1q3zwtq2w0z9muz6hl5qeh0a7ej94ygrkchn6ksc</div>
    <p>Once sent, your order will be processed.</p>
    <a href="index.html" class="btn">Back</a>
</div>

</body>
</html>
